# Reverse proxy for the Digital Nalanda staging stack on a shared Droplet.
# This nginx runs INSIDE a container and is published on host port 8080 only,
# so it never touches the host's own nginx on 80/443.
# Same-origin path routing: /api,/admin,/static,/media -> Django; rest -> Next.js.

upstream nalanda_api { server api:8080; }
upstream nalanda_web { server web:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Common proxy headers (inherited by all location blocks below).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/    { proxy_pass http://nalanda_api; }
    location /admin/  { proxy_pass http://nalanda_api; }
    location /static/ { proxy_pass http://nalanda_api; }
    location /media/  { proxy_pass http://nalanda_api; }

    location / { proxy_pass http://nalanda_web; }
}
