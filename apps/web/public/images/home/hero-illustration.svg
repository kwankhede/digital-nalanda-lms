<!-- TODO: replace with the final commissioned editorial illustration of Digital Nalanda.
     This is a symbolic placeholder (learners around a laptop showing the brand mark,
     books, path signpost and subtle circuit motifs) — no real-person portrait. -->
<svg viewBox="0 0 640 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Learners gathered around a laptop showing the Digital Nalanda mark, with books, a path signpost and subtle digital circuit patterns">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f8f"/>
      <stop offset="1" stop-color="#16314d"/>
    </linearGradient>
    <linearGradient id="leafH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b73c"/>
      <stop offset="1" stop-color="#e8901f"/>
    </linearGradient>
  </defs>

  <!-- soft background blobs -->
  <circle cx="120" cy="120" r="90" fill="#f2a52c" opacity="0.12"/>
  <circle cx="540" cy="170" r="70" fill="#2f6d75" opacity="0.12"/>
  <circle cx="500" cy="430" r="80" fill="#c0402f" opacity="0.10"/>

  <!-- subtle circuit motif -->
  <g stroke="#5b6b7b" stroke-width="2" opacity="0.35" fill="none">
    <path d="M40 300 H 96 V 250 H 130"/>
    <circle cx="40" cy="300" r="4" fill="#5b6b7b" stroke="none"/>
    <circle cx="130" cy="250" r="4" fill="#5b6b7b" stroke="none"/>
    <path d="M600 330 H 548 V 286 H 512"/>
    <circle cx="600" cy="330" r="4" fill="#5b6b7b" stroke="none"/>
    <circle cx="512" cy="286" r="4" fill="#5b6b7b" stroke="none"/>
    <path d="M560 90 V 130 H 520"/>
    <circle cx="560" cy="90" r="4" fill="#e8901f" stroke="none"/>
  </g>

  <!-- faint dharma-wheel sun -->
  <g transform="translate(548 96)" stroke="#e8901f" stroke-width="3" fill="none" opacity="0.45">
    <circle r="34"/>
    <g stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="34"/>
      <line x1="-34" y1="0" x2="34" y2="0"/>
      <line x1="-24" y1="-24" x2="24" y2="24"/>
      <line x1="24" y1="-24" x2="-24" y2="24"/>
    </g>
  </g>

  <!-- path signpost (life of purpose) -->
  <g transform="translate(78 250)">
    <rect x="-4" y="0" width="8" height="150" rx="3" fill="#9a7b4f"/>
    <path d="M6 14 H 70 L 84 28 L 70 42 H 6 Z" fill="url(#leafH)"/>
    <path d="M-6 50 H -70 L -84 64 L -70 78 H -6 Z" fill="#2f6d75"/>
  </g>

  <!-- stacked books -->
  <g transform="translate(150 392)">
    <rect x="0" y="40" width="150" height="22" rx="4" fill="#c0402f"/>
    <rect x="12" y="20" width="138" height="22" rx="4" fill="#2f6d75"/>
    <rect x="4" y="0" width="150" height="22" rx="4" fill="#e8901f"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.5">
      <line x1="130" y1="51" x2="142" y2="51"/>
      <line x1="138" y1="31" x2="146" y2="31"/>
      <line x1="130" y1="11" x2="142" y2="11"/>
    </g>
  </g>

  <!-- desk -->
  <rect x="120" y="436" width="420" height="10" rx="5" fill="#16314d" opacity="0.15"/>

  <!-- laptop -->
  <g transform="translate(320 350)">
    <!-- screen -->
    <rect x="-118" y="-150" width="236" height="150" rx="12" fill="#16314d"/>
    <rect x="-108" y="-140" width="216" height="130" rx="8" fill="url(#screen)"/>
    <!-- brand mark on screen -->
    <g transform="translate(-58 -75)">
      <g stroke="#f3a01c" fill="none">
        <circle r="30" stroke-width="5"/>
        <circle r="7" fill="#f3a01c" stroke="none"/>
        <g stroke-width="3.5" stroke-linecap="round">
          <line x1="0" y1="-30" x2="0" y2="30"/>
          <line x1="-30" y1="0" x2="30" y2="0"/>
          <line x1="-21" y1="-21" x2="21" y2="21"/>
          <line x1="21" y1="-21" x2="-21" y2="21"/>
        </g>
      </g>
    </g>
    <text x="-12" y="-78" font-family="Georgia, serif" font-size="20" fill="#ffffff">DIGITAL</text>
    <text x="-12" y="-54" font-family="Georgia, serif" font-size="20" fill="#f2a52c">NALANDA</text>
    <!-- base -->
    <path d="M-140 0 H 140 L 156 22 H -156 Z" fill="#cfd8e3"/>
    <rect x="-22" y="0" width="44" height="8" rx="3" fill="#aab6c6"/>
  </g>

  <!-- learners (stylised, generic) -->
  <g>
    <!-- left student -->
    <g transform="translate(196 372)">
      <circle cx="0" cy="-26" r="20" fill="#e8901f"/>
      <path d="M-30 36 C -30 -2, 30 -2, 30 36 Z" fill="#2f6d75"/>
      <circle cx="-7" cy="-28" r="2.2" fill="#16314d"/>
      <circle cx="6" cy="-28" r="2.2" fill="#16314d"/>
    </g>
    <!-- right student -->
    <g transform="translate(452 372)">
      <circle cx="0" cy="-26" r="20" fill="#c0402f"/>
      <path d="M-30 36 C -30 -2, 30 -2, 30 36 Z" fill="#1f5f8f"/>
      <circle cx="-7" cy="-28" r="2.2" fill="#fff"/>
      <circle cx="6" cy="-28" r="2.2" fill="#fff"/>
    </g>
    <!-- far right student -->
    <g transform="translate(508 386)">
      <circle cx="0" cy="-22" r="16" fill="#f2a52c"/>
      <path d="M-24 30 C -24 0, 24 0, 24 30 Z" fill="#2f6d75"/>
    </g>
  </g>
</svg>
