<svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Support illustration: open hands offering a bodhi leaf with a dharma wheel, symbolising giving to education">
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="hands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1f4d"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="140" r="130" fill="url(#halo)"/>

  <!-- Bodhi leaf with chakra -->
  <g transform="translate(160 118)">
    <path d="M0 -78 C 56 -44, 70 24, 0 78 C -70 24, -56 -44, 0 -78 Z" fill="url(#leaf2)"/>
    <path d="M0 78 L 0 -64" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M0 30 C 22 22, 34 6, 40 -16 M0 6 C 20 0, 30 -14, 34 -34 M0 -18 C 16 -24, 22 -36, 24 -50 M0 30 C -22 22, -34 6, -40 -16 M0 6 C -20 0, -30 -14, -34 -34 M0 -18 C -16 -24, -22 -36, -24 -50"
          stroke="#b45309" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <!-- small chakra -->
    <g stroke="#0b1f4d" fill="none" transform="translate(0 -4)">
      <circle r="26" stroke-width="4"/>
      <circle r="4" fill="#0b1f4d" stroke="none"/>
      <g stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="24"/>
        <line x1="-24" y1="0" x2="24" y2="0"/>
        <line x1="-17" y1="-17" x2="17" y2="17"/>
        <line x1="17" y1="-17" x2="-17" y2="17"/>
      </g>
    </g>
  </g>

  <!-- Open hands offering -->
  <g fill="url(#hands)">
    <path d="M70 196 C 60 188, 52 196, 58 208 C 70 232, 110 262, 160 268 C 150 244, 120 214, 96 204 C 88 200, 78 200, 70 196 Z"/>
    <path d="M250 196 C 260 188, 268 196, 262 208 C 250 232, 210 262, 160 268 C 170 244, 200 214, 224 204 C 232 200, 242 200, 250 196 Z"/>
  </g>
  <path d="M160 268 C 130 260, 105 238, 92 214 M160 268 C 190 260, 215 238, 228 214"
        stroke="#ffffff" stroke-width="2" opacity="0.25" fill="none" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#f59e0b">
    <circle cx="92" cy="86" r="4"/>
    <circle cx="232" cy="78" r="3"/>
    <circle cx="250" cy="150" r="3.5"/>
    <circle cx="64" cy="150" r="3"/>
  </g>
</svg>
