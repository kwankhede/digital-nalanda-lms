# Digital Nalanda — STAGING stack for a shared Droplet.
#
# Runs as isolated containers and publishes ONLY the proxy on host port 8080,
# so it never collides with the host's existing nginx on 80/443.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# All configuration comes from ./.env.prod (see DROPLET_DEPLOYMENT.md).
name: digital-nalanda

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_nalanda}
      POSTGRES_USER: ${POSTGRES_USER:-nalanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - dn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nalanda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      # Point Django at the postgres container (overrides any DATABASE_URL in env file).
      DATABASE_URL: postgres://${POSTGRES_USER:-nalanda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digital_nalanda}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the client bundle at build time. Must be the public URL.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.prod}
    restart: unless-stopped
    environment:
      PORT: "8080"
    depends_on:
      - api
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nalanda.staging.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # host:container — only this is exposed publicly
    depends_on:
      - api
      - web

volumes:
  dn_pgdata:
